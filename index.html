  <script>
    const container = document.querySelector(".rain-container");

    // Add or remove items here to change what falls
    const words = ["Roshani", "Roshani 💟", "💟"];
    const colors = ["#ff4d8d", "#ff85a2", "#ffffff"];

    function createRain() {
      const item = document.createElement("div");
      item.classList.add("rain-heart");
      item.textContent = words[Math.floor(Math.random() * words.length)];

      // random position, size, speed and color
      item.style.left = Math.random() * 90 + "vw";
      item.style.fontSize = Math.random() * 20 + 15 + "px";
      item.style.animationDuration = Math.random() * 2 + 3 + "s";
      item.style.color = colors[Math.floor(Math.random() * colors.length)];

      container.appendChild(item);

      // remove after animation
      setTimeout(() => item.remove(), 6000);
    }

    setInterval(createRain, 200);
